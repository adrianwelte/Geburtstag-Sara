<meta charset="utf-8">
<title>Vaselina para Sara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Karla:ital,wght@0,400;0,500;0,700;1,400&family=Shrikhand&display=swap">
<style>
  :root{
    --ink:#16131a;
    --ink-soft:#4b4550;
    --paper:#fbf5ec;
    --paper-2:#f4ead9;
    --red:#d81f27;
    --red-deep:#a9151c;
    --pink:#f2bfd0;
    --pink-pale:#fbe6ee;
    --chrome:#c3c7cd;
    --shadow:rgba(22,19,26,.18);
    --check:34px;
    --display:"Shrikhand",Georgia,serif;
    --label:"Bebas Neue","Arial Narrow",sans-serif;
    --body:"Karla","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--ink);
    color:var(--ink);
    font-family:var(--body);
    font-size:16px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  button{font:inherit;color:inherit}

  /* ---------- stage & checkerboard frame ---------- */
  .stage{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:clamp(10px,2.5vw,28px);
    background:
      radial-gradient(120% 90% at 50% 0%, #2a252f 0%, #16131a 60%, #0d0b10 100%);
  }
  .card{
    position:relative;
    width:min(760px,100%);
    background:var(--paper);
    border-radius:6px;
    box-shadow:0 30px 70px rgba(0,0,0,.55), 0 2px 0 rgba(255,255,255,.25) inset;
    overflow:hidden;
    isolation:isolate;
  }
  .checker{
    position:absolute;left:0;right:0;height:26px;z-index:4;
    background-color:#fff;
    background-image:
      conic-gradient(var(--ink) 90deg, #fff 90deg 180deg, var(--ink) 180deg 270deg, #fff 270deg);
    background-size:var(--check) var(--check);
    background-position:0 0;
  }
  .checker.top{top:0}
  .checker.bottom{bottom:0;background-position:calc(var(--check)/2) 0}

  .card-inner{
    position:relative;
    z-index:2;
    padding:clamp(46px,7vw,64px) clamp(22px,6vw,58px);
    min-height:min(640px,82vh);
    display:flex;
    flex-direction:column;
  }

  /* diagonal pink checks, drifting behind the content */
  .card::before{
    content:"";
    position:absolute;
    left:18%;top:-30%;width:120%;height:150%;
    z-index:0;
    background-image:
      conic-gradient(var(--pink) 90deg, transparent 90deg 180deg, var(--pink) 180deg 270deg, transparent 270deg);
    background-size:76px 76px;
    transform:rotate(-13deg);
    opacity:.34;
    -webkit-mask-image:radial-gradient(80% 62% at 20% 40%, transparent 0%, #000 66%);
    mask-image:radial-gradient(80% 62% at 20% 40%, transparent 0%, #000 66%);
    pointer-events:none;
  }

  /* ---------- top bar ---------- */
  .topbar{
    position:relative;z-index:5;
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    margin-bottom:clamp(18px,4vw,34px);
  }
  .lang{
    display:inline-flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff;
  }
  .lang button{
    border:0;background:transparent;cursor:pointer;
    font-family:var(--label);font-size:15px;letter-spacing:.14em;
    padding:6px 14px 4px;color:var(--ink-soft);
    transition:background .18s ease,color .18s ease;
  }
  .lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
  .lang button:focus-visible{outline:3px solid var(--red);outline-offset:2px}

  .progress{display:flex;align-items:center;gap:9px}
  .dot{
    width:11px;height:11px;border-radius:50%;
    background:transparent;border:2px solid var(--ink);
    padding:0;cursor:pointer;transition:background .2s ease,transform .2s ease;
  }
  .dot[aria-current="true"]{background:var(--red);border-color:var(--red);transform:scale(1.25)}
  .dot.done{background:var(--ink)}
  .dot:focus-visible{outline:3px solid var(--red);outline-offset:3px}

  /* ---------- steps ---------- */
  .steps{position:relative;flex:1;display:flex}
  .step{
    display:none;
    flex-direction:column;
    justify-content:center;
    width:100%;
  }
  .step.is-active{display:flex;animation:slidein .5s cubic-bezier(.22,.8,.28,1) both}
  @keyframes slidein{
    from{opacity:0;transform:translateY(18px) rotate(.4deg)}
    to{opacity:1;transform:none}
  }

  .eyebrow{
    font-family:var(--label);
    font-size:clamp(14px,2.6vw,17px);
    letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0 0 6px;
  }
  .kicker{
    font-family:var(--label);
    font-size:clamp(26px,6vw,42px);
    letter-spacing:.1em;
    text-transform:uppercase;
    margin:0;
    line-height:1;
  }
  .name{
    font-family:var(--display);
    color:var(--red);
    font-size:clamp(72px,19vw,150px);
    line-height:.82;
    margin:.08em 0 .18em -.04em;
    text-shadow:5px 5px 0 rgba(22,19,26,.14);
  }
  h2.title{
    font-family:var(--display);
    color:var(--red);
    font-size:clamp(40px,10vw,74px);
    line-height:.95;
    margin:.05em 0 .3em;
    text-wrap:balance;
  }
  .lead{
    font-size:clamp(16px,2.6vw,19px);
    max-width:46ch;
    margin:0 0 26px;
    color:var(--ink);
  }
  .fine{font-size:14px;color:var(--ink-soft);margin:14px 0 0;max-width:44ch}

  /* ---------- buttons ---------- */
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:auto;padding-top:26px}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;text-align:center;flex-wrap:wrap;gap:6px 10px;
    font-family:var(--label);font-size:19px;letter-spacing:.12em;text-transform:uppercase;
    padding:13px 26px 10px;border-radius:999px;border:2px solid var(--ink);
    background:var(--red);color:#fff;cursor:pointer;text-decoration:none;
    box-shadow:4px 4px 0 var(--ink);
    transition:transform .14s ease,box-shadow .14s ease,background .14s ease;
  }
  .btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink);background:var(--red-deep)}
  .btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
  .btn.ghost{background:#fff;color:var(--ink);box-shadow:4px 4px 0 var(--chrome)}
  .btn.ghost:hover{background:var(--paper-2);box-shadow:6px 6px 0 var(--chrome)}
  .btn:focus-visible{outline:3px solid var(--red);outline-offset:4px}
  .link-back{
    background:none;border:0;cursor:pointer;
    font-family:var(--label);font-size:16px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-soft);padding:8px 4px;text-decoration:underline;text-underline-offset:5px;
  }
  .link-back:hover{color:var(--ink)}
  .link-back:focus-visible{outline:3px solid var(--red);outline-offset:3px}

  /* ---------- pieces ---------- */
  .vinyl{
    position:absolute;z-index:1;pointer-events:none;
    width:clamp(120px,26vw,210px);aspect-ratio:1;border-radius:50%;
    background:
      radial-gradient(circle at 50% 50%, #e7b7d0 0 7%, #1a1a1e 7.5% 12%, #26262c 12% 13%, #1a1a1e 13% 20%,
      #26262c 20% 21%, #1a1a1e 21% 30%, #2a2a30 30% 31%, #1a1a1e 31% 44%, #24242a 44% 45%, #16161a 45% 100%);
    box-shadow:0 12px 26px rgba(0,0,0,.25);
    opacity:.9;
  }
  .vinyl.a{right:-64px;bottom:-52px;animation:spin 16s linear infinite}
  .vinyl.b{left:-58px;bottom:34%;width:clamp(88px,16vw,132px);opacity:.75;animation:spin 22s linear infinite reverse}
  @keyframes spin{to{transform:rotate(360deg)}}

  .lips{position:absolute;z-index:1;right:clamp(18px,5vw,44px);top:clamp(44px,8vw,66px);width:clamp(58px,11vw,92px);opacity:.95;pointer-events:none}

  .grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin:6px 0 4px}
  .tile{
    background:#fff;border:2px solid var(--ink);border-radius:4px;
    padding:18px 20px 20px;box-shadow:5px 5px 0 var(--pink);
  }
  .tile h3{
    font-family:var(--label);font-size:24px;letter-spacing:.08em;text-transform:uppercase;
    margin:0 0 8px;color:var(--red);
  }
  .tile ul{margin:0;padding-left:18px;font-size:15px}
  .tile li{margin-bottom:4px}

  .facts{display:grid;gap:0;margin:4px 0 8px;border:2px solid var(--ink);background:#fff;box-shadow:6px 6px 0 var(--ink)}
  .fact{display:flex;gap:16px;align-items:baseline;padding:15px 20px;border-bottom:2px solid var(--ink)}
  .fact:last-child{border-bottom:0}
  .fact dt{
    font-family:var(--label);font-size:16px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-soft);min-width:104px;margin:0;
  }
  .fact dd{margin:0;font-size:clamp(17px,3vw,21px);font-weight:700}
  .fact dd small{display:block;font-weight:400;font-size:14px;color:var(--ink-soft);letter-spacing:0}

  .polaroid{
    background:#fff;padding:12px 12px 46px;border:2px solid var(--ink);
    box-shadow:7px 7px 0 var(--ink);transform:rotate(-2.2deg);
    width:min(240px,100%);position:relative;
  }
  .polaroid img{display:block;width:100%;height:auto}
  .polaroid figcaption{
    position:absolute;left:0;right:0;bottom:14px;text-align:center;
    font-family:var(--label);font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);
  }
  .split{display:grid;gap:26px;grid-template-columns:1fr;align-items:start}
  @media(min-width:640px){.split{grid-template-columns:1fr 240px}}

  .stamp{
    display:inline-block;border:3px double var(--red);color:var(--red);
    font-family:var(--label);font-size:clamp(20px,4.4vw,30px);letter-spacing:.14em;text-transform:uppercase;
    padding:8px 18px 5px;transform:rotate(-4deg);margin-top:6px;
  }

  /* ---------- form ---------- */
  .choices{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:20px}
  .choice{
    text-align:left;cursor:pointer;background:#fff;border:2px solid var(--ink);border-radius:4px;
    padding:16px 18px;box-shadow:4px 4px 0 var(--chrome);
    transition:box-shadow .15s ease,transform .15s ease,background .15s ease;
  }
  .choice b{display:block;font-family:var(--label);font-size:21px;letter-spacing:.08em;text-transform:uppercase}
  .choice span{font-size:14px;color:var(--ink-soft)}
  .choice:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--chrome)}
  .choice[aria-pressed="true"]{background:var(--red);color:#fff;box-shadow:4px 4px 0 var(--ink)}
  .choice[aria-pressed="true"] span{color:#ffd9dc}
  .choice:focus-visible{outline:3px solid var(--red);outline-offset:3px}

  .fields{display:grid;gap:14px;grid-template-columns:1fr;margin-bottom:6px}
  @media(min-width:560px){.fields.two{grid-template-columns:2fr 1fr}}
  label{display:block;font-family:var(--label);font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:5px}
  input,textarea{
    width:100%;font-family:var(--body);font-size:16px;color:var(--ink);
    background:#fff;border:2px solid var(--ink);border-radius:4px;padding:11px 13px;
  }
  input:focus,textarea:focus{outline:3px solid var(--red);outline-offset:1px}
  textarea{resize:vertical;min-height:78px}
  .hidden{display:none !important}

  .msgbox{
    background:#fff;border:2px dashed var(--ink);border-radius:4px;padding:14px 16px;
    font-size:15px;white-space:pre-wrap;margin:4px 0 0;
  }
  .toast{font-family:var(--label);letter-spacing:.12em;text-transform:uppercase;color:var(--red);font-size:15px;margin:10px 0 0;min-height:20px}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important}
  }
  @media (max-width:600px){
    .card-inner{min-height:78vh}
    .lips{display:none}
    .btn{font-size:17px;padding:12px 20px 9px}
    .name{font-size:clamp(64px,22vw,110px)}
  }
</style>

<div class="stage">
  <div class="card">
    <div class="checker top"></div>
    <div class="checker bottom"></div>
    <div class="vinyl a"></div>

    <div class="card-inner">
      <div class="topbar">
        <div class="lang" role="group" aria-label="Idioma / Sprache">
          <button type="button" data-lang="es" aria-pressed="true">ES</button>
          <button type="button" data-lang="de" aria-pressed="false">DE</button>
        </div>
        <div class="progress" id="progress" aria-label="1 / 5"></div>
      </div>

      <div class="steps">

        <!-- 1 &#8212; cover -->
        <section class="step is-active" data-step="1">
          <svg class="lips" viewBox="0 0 100 66" aria-hidden="true">
            <path d="M50 20c-7-12-19-19-31-16C10 6 3 13 0 21c9 0 17 3 23 7-8 1-16 3-23 7 7 17 27 29 50 29s43-12 50-29c-7-4-15-6-23-7 6-4 14-7 23-7-3-8-10-15-19-17-12-3-24 4-31 16z" fill="#d81f27"/>
          </svg>
          <p class="eyebrow" data-t="cover.eyebrow"></p>
          <h1 class="kicker" data-t="cover.kicker"></h1>
          <div class="name">Sara</div>
          <p class="lead" data-t="cover.lead"></p>
          <div class="row">
            <button class="btn" type="button" data-go="2"><span data-t="cover.cta"></span> &#8594;</button>
          </div>
        </section>

        <!-- 2 &#8212; theme -->
        <section class="step" data-step="2">
          <p class="eyebrow" data-t="theme.eyebrow"></p>
          <h2 class="title">Vaselina</h2>
          <p class="lead" data-t="theme.lead"></p>
          <div class="grid2">
            <div class="tile">
              <h3 data-t="theme.pinkTitle"></h3>
              <ul>
                <li data-t="theme.pink1"></li>
                <li data-t="theme.pink2"></li>
                <li data-t="theme.pink3"></li>
              </ul>
            </div>
            <div class="tile">
              <h3 data-t="theme.tbTitle"></h3>
              <ul>
                <li data-t="theme.tb1"></li>
                <li data-t="theme.tb2"></li>
                <li data-t="theme.tb3"></li>
              </ul>
            </div>
          </div>
          <p class="fine" data-t="theme.fine"></p>
          <div class="row">
            <button class="link-back" type="button" data-go="1">&#8592;</button>
            <button class="btn" type="button" data-go="3"><span data-t="nav.next"></span> &#8594;</button>
          </div>
        </section>

        <!-- 3 &#8212; when & where -->
        <section class="step" data-step="3">
          <p class="eyebrow" data-t="when.eyebrow"></p>
          <h2 class="title" data-t="when.title"></h2>
          <dl class="facts">
            <div class="fact"><dt data-t="when.dateLabel"></dt><dd data-t="when.date"></dd></div>
            <div class="fact"><dt data-t="when.timeLabel"></dt><dd data-t="when.time"></dd></div>
            <div class="fact"><dt data-t="when.placeLabel"></dt><dd>C. 63-E Ote. 1410<small>Villa Universitaria &#183; 72589 Heroica Puebla de Zaragoza, Pue., M&#233;xico</small></dd></div>
          </dl>
          <div class="row">
            <button class="link-back" type="button" data-go="2">&#8592;</button>
            <a class="btn ghost" id="mapsLink" href="https://www.google.com/maps/search/?api=1&amp;query=C.%2063-E%20Ote.%201410%2C%20Villa%20Universitaria%2C%2072589%20Heroica%20Puebla%20de%20Zaragoza%2C%20Pue." target="_blank" rel="noopener"><span data-t="when.maps"></span></a>
            <button class="btn" type="button" data-go="4"><span data-t="nav.next"></span> &#8594;</button>
          </div>
        </section>

        <!-- 4 &#8212; details -->
        <section class="step" data-step="4">
          <p class="eyebrow" data-t="gift.eyebrow"></p>
          <div class="split">
            <div>
              <h2 class="title" data-t="gift.title"></h2>
              <p class="lead" data-t="gift.lead"></p>
              <div class="stamp" data-t="gift.stamp"></div>

var lang = "es";
var step = 1;
var answer = null;
var STEPS = 6;
var DOTS = 5;

function t(key){ return (T[lang] && T[lang][key]) || key; }

function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(function(el){
    el.textContent = t(el.getAttribute("data-t"));
  });
  document.querySelectorAll(".lang button").forEach(function(b){
    b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
  });
  document.getElementById("fMsg").placeholder = lang === "es" ? "Nos vemos ah\u00ed\u2026" : "Wir sehen uns\u2026";
  if (step === 6) renderDone();
}

function buildProgress(){
  var p = document.getElementById("progress");
  p.innerHTML = "";
  for (var i = 1; i <= DOTS; i++){
    (function(i){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "dot";
      b.setAttribute("aria-label", i + " / " + DOTS);
      b.addEventListener("click", function(){ go(i); });
      p.appendChild(b);
    })(i);
  }
}

function paintProgress(){
  var dots = document.querySelectorAll(".dot");
  dots.forEach(function(d, idx){
    var n = idx + 1;
    d.setAttribute("aria-current", String(n === step));
    d.classList.toggle("done", n < step || step === 6);
  });
  document.getElementById("progress").setAttribute("aria-label", Math.min(step, DOTS) + " / " + DOTS);
}

function go(n){
  step = n;
  document.querySelectorAll(".step").forEach(function(s){
    s.classList.toggle("is-active", Number(s.dataset.step) === n);
  });
  paintProgress();
  var card = document.querySelector(".card");
  if (card) card.scrollIntoView({block:"start", behavior:"smooth"});
}

function composeMessage(){
  var name = document.getElementById("fName").value.trim();
  var guests = document.getElementById("fGuests").value || "1";
  var extra = document.getElementById("fMsg").value.trim();
  var base = answer === "yes"
    ? t("msg.yes").replace("{n}", guests).replace("{name}", name)
    : t("msg.no").replace("{name}", name);
  return extra ? base + "\n" + extra : base;
}

function renderDone(){
  var msg = composeMessage();
  document.getElementById("doneTitle").textContent = answer === "yes" ? t("done.titleYes") : t("done.titleNo");
  document.getElementById("doneLead").textContent = answer === "yes" ? t("done.leadYes") : t("done.leadNo");
  document.getElementById("msgPreview").textContent = msg;
  var href = WHATSAPP_NUMBER
    ? "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(msg)
    : "https://wa.me/?text=" + encodeURIComponent(msg);
  document.getElementById("waLink").href = href;
}

function setAnswer(v){
  answer = v;
  document.getElementById("choiceYes").setAttribute("aria-pressed", String(v === "yes"));
  document.getElementById("choiceNo").setAttribute("aria-pressed", String(v === "no"));
  document.getElementById("guestsWrap").classList.toggle("hidden", v !== "yes");
  document.getElementById("toast").textContent = "";
}

document.querySelectorAll("[data-go]").forEach(function(b){
  b.addEventListener("click", function(){ go(Number(b.dataset.go)); });
});
document.querySelectorAll(".lang button").forEach(function(b){
  b.addEventListener("click", function(){ lang = b.dataset.lang; applyLang(); });
});
document.getElementById("choiceYes").addEventListener("click", function(){ setAnswer("yes"); });
document.getElementById("choiceNo").addEventListener("click", function(){ setAnswer("no"); });

document.getElementById("send").addEventListener("click", function(){
  var toast = document.getElementById("toast");
  if (!answer){ toast.textContent = t("rsvp.errChoice"); return; }
  if (!document.getElementById("fName").value.trim()){ toast.textContent = t("rsvp.errName"); document.getElementById("fName").focus(); return; }
  toast.textContent = "";
  renderDone();
  go(6);
  var link = document.getElementById("waLink");
  window.open(link.href, "_blank", "noopener");
});

document.getElementById("copyBtn").addEventListener("click", function(){
  var txt = document.getElementById("msgPreview").textContent;
  var done = function(){
    var span = document.querySelector("#copyBtn span");
    span.textContent = t("done.copied");
    setTimeout(function(){ span.textContent = t("done.copy"); }, 1800);
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done, function(){});
  }
});

document.addEventListener("keydown", function(e){
  if (e.target.matches("input, textarea")) return;
  if (e.key === "ArrowRight" && step < 5) go(step + 1);
  if (e.key === "ArrowLeft" && step > 1) go(step - 1);
});

buildProgress();
applyLang();
setAnswer(null);
document.getElementById("guestsWrap").classList.add("hidden");
paintProgress();
</script>
